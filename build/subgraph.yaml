specVersion: 0.0.4
description: Dodoex.io
features:
  - grafting
repository: https://github.com/DODOEX/amm_v2_subgraph
schema:
  file: amm-v2.graphql
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: pharos-testnet
    source:
      address: "0x7b29694E8d44c154E3a2c20A6A2D665D65264e6e"
      abi: Factory
      startBlock: 9682639
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: Factory/Factory.wasm
      entities:
        - Pair
        - Token
      abis:
        - name: Factory
          file: ../abis/amm-v2/factory.json
        - name: ERC20
          file: ../abis/amm-v2/ERC20.json
        - name: ERC20SymbolBytes
          file: ../abis/amm-v2/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ../abis/amm-v2/ERC20NameBytes.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256,uint256)
          handler: handleNewPair
templates:
  - kind: ethereum/contract
    name: Pair
    network: pharos-testnet
    source:
      abi: Pair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: templates/Pair/Pair.wasm
      entities:
        - Pair
        - Token
      abis:
        - name: Pair
          file: ../abis/amm-v2/pair.json
        - name: Factory
          file: ../abis/amm-v2/factory.json
        - name: ERC20
          file: ../abis/amm-v2/ERC20.json
        - name: ERC20SymbolBytes
          file: ../abis/amm-v2/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ../abis/amm-v2/ERC20NameBytes.json
      eventHandlers:
        - event: Mint(indexed address,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,uint256,uint256,indexed address)
          handler: handleBurn
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Sync(uint112,uint112)
          handler: handleSync
        - event: FeeRateChange(uint256)
          handler: handleFeeRateChange
        - event: LpMtRatioChange(uint256)
          handler: handleLpMtRatioChange
