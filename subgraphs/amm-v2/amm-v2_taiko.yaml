specVersion: 0.0.4
description: Dodoex.io
# graft:
#   base: QmYbAxokzn5w3CT9byQYa7aF33LM3CcLN8Rr5weLTFSgdm
#   block: 19337060
features:
  - grafting
repository: https://github.com/DODOEX/amm_v2_subgraph
schema:
  file: ./amm-v2.graphql
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: taiko
    source:
      address: '0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f'
      abi: Factory
      startBlock: 10000834
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ../../src/mappings/amm-v2/factory.ts
      entities:
        - Pair
        - Token
      abis:
        - name: Factory
          file: ../../abis/amm-v2/factory.json
        - name: ERC20
          file: ../../abis/amm-v2/ERC20.json
        - name: ERC20SymbolBytes
          file: ../../abis/amm-v2/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ../../abis/amm-v2/ERC20NameBytes.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handleNewPair
templates:
  - kind: ethereum/contract
    name: Pair
    network: taiko
    source:
      abi: Pair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ../../src/mappings/amm-v2/core.ts
      entities:
        - Pair
        - Token
      abis:
        - name: Pair
          file: ../../abis/amm-v2/pair.json
        - name: Factory
          file: ../../abis/amm-v2/factory.json
      eventHandlers:
        - event: Mint(indexed address,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,uint256,uint256,indexed address)
          handler: handleBurn
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Sync(uint112,uint112)
          handler: handleSync
