  "maintainer fee rate"
  mtFeeRate: BigInt!
  "maintainer fee base token"
  mtFeeBase: BigDecimal!
  "maintainer fee quote token"
  mtFeeQuote: BigDecimal!
  "maintainer fee in USD"
  mtFeeUSD: BigDecimal!

  "trader count"
