type AMMFactory @entity {
  # factory address
  id: ID!

  # pair info
  pairCount: Int!

  # total volume
  totalVolumeUSD: BigDecimal!
  totalVolumeETH: BigDecimal!

  # untracked values - less confident USD scores
  untrackedVolumeUSD: BigDecimal!

  # total liquidity
  totalLiquidityUSD: BigDecimal!
  totalLiquidityETH: BigDecimal!

  # transactions
  txCount: BigInt!

  "updatedAt"
  updatedAt: BigInt
}

type AMMDayData @entity {
  "day id"
  id: ID!
  "uinx timestamp(start of day)"
  date: Int!
  "transactions count"
  txCount: BigInt!
  "unique users"
  uniqueUsersCount: BigInt!
  "volume usd"
  volumeUSD: BigDecimal!
  "fee usd"
  feeUSD: BigDecimal!
  "maintainer fee usd"
  maintainerFeeUSD: BigDecimal!

  dailyVolumeETH: BigDecimal!
  dailyVolumeUSD: BigDecimal!
  dailyVolumeUntracked: BigDecimal!

  totalVolumeETH: BigDecimal!
  totalLiquidityETH: BigDecimal!
  totalVolumeUSD: BigDecimal! # Accumulate at each trade, not just calculated off whatever totalVolume is. making it more accurate as it is a live conversion
  totalLiquidityUSD: BigDecimal!

  "updatedAt"
  updatedAt: BigInt
}

type Transaction @entity {
  "hash"
  id: ID!
  blockNumber: BigInt!
  "timestamp"
  timestamp: BigInt!
  "from"
  from: String!
  "to"
  to: String
  "sender"
  sender: String!
  "type(TRADE、LP、CP)"
  type: String!
  "tokens"
  tokens: [Token!]
  "volumeUSD"
  volumeUSD: BigDecimal!
  "event address"
  address: Bytes!

  mints: [Mint!]!
  burns: [Burn!]!
  swaps: [Swap!]!

  "updatedAt"
  updatedAt: BigInt
}

